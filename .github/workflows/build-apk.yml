name: Build APK

on:
  push:
    branches:
      - main  # 如果您的主分支叫 master，请修改为 master
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 配置 JDK 环境 (Android 开发通常推荐 Java 17 或 21)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # 自动缓存 Gradle 依赖，大幅提升后续构建速度

      # 3. 赋予 Gradle Wrapper 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 使用 Gradle 构建 Release APK
      - name: Build APK
        run: ./gradlew assembleRelease

      # 5. 上传生成的 APK 文件到 Artifacts 供下载
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk # 根据实际 app 模块目录调整路径
